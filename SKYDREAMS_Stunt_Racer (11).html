<style>

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}

#cn{font-size:26px;margin-bottom:8px}
.st{display:flex;align-items:center;gap:10px;font-size:15px;margin:5px 0}.st span:first-child{width:92px;text-align:left}
.sg{display:flex;gap:4px;flex:1}.sg i{flex:1;height:10px;border-radius:3px;background:#2a2d60}.sg i.on{background:var(--lime)}

/* PS3 XMB glass skin */

#sth{display:flex;justify-content:space-between;align-items:center}.ty{color:#ffb21a;font-size:clamp(22px,4vw,34px);text-shadow:0 3px 0 #000}#sth small{display:block;font-size:12px;opacity:.7}
#stt{display:flex;gap:6px;justify-content:space-around;border-bottom:2px solid #2a3c52;margin:8px 0 6px}#stt span{padding:6px 10px;font-size:clamp(14px,2.4vw,20px);border-bottom:4px solid transparent;opacity:.8}#stt span.on{color:#39d0ff;border-color:#39d0ff;opacity:1}

.tl .pr{background:#a9d3d0;color:#d62828;font-size:13px;padding:3px 0}.tl .pr.ow{color:#1b7a2a}.tl .nm{padding:4px 3px 6px;line-height:1.15;color:#fff}
#sft{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:2px solid #2a3c52;padding-top:8px}#sfi{text-align:left;flex:1;font-size:16px}#sfi .st{margin:2px 0;font-size:12px}#sft .row{margin:0}#sft button{font-size:17px;padding:8px 14px}

 i.coin{position:absolute;top:-40px;font-size:28px;font-style:normal;animation:fall linear forwards}@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}#fl.go{animation:flash .7s ease-out}@keyframes flash{from{opacity:.9}to{opacity:0}}#coins{color:#ffd23a}.chip.lk{opacity:.5}#vg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,20,.5) 100%)}

#cs{position:fixed;left:14px;right:332px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;overflow-x:auto;padding:8px 4px;touch-action:pan-x;scrollbar-width:none;z-index:2}

.chip.on{opacity:1;border-color:var(--lime);transform:scale(1.08);box-shadow:0 0 18px rgba(182,242,0,.6)}
@media (orientation:portrait){#xm{left:0;right:0;justify-content:center;top:calc(66px + env(safe-area-inset-top,0px))}#cs{right:14px;bottom:calc(250px + env(safe-area-inset-bottom,0px))}}

html,body{height:100%;height:100dvh}

.ty{font-size:20px}#sth small{display:none}#stt span{padding:3px 8px;font-size:14px}

#sel{padding:calc(40px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) 12px}
.bot{width:min(350px,46vw);max-height:calc(100vh - 54px);max-height:calc(100dvh - 54px);overflow-y:auto;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.bot #cn{width:100%;font-size:18px;margin:0}.bot #sts{width:100%}.bot .row{margin:0;flex:1 1 46%}.bot .row:last-child{flex-basis:100%}
.bot button{font-size:15px;padding:6px 8px}.bot .row .main{font-size:18px}.st{margin:2px 0;font-size:13px}

#xm{font-size:12px;gap:10px;top:calc(8px + env(safe-area-inset-top,0px))}#sel h2{font-size:22px;top:calc(8px + env(safe-area-inset-top,0px))}}

.pill{font-size:17px;padding:4px 10px}#pos{font-size:22px}#hud button{width:38px;height:38px;font-size:16px}

#bar{top:calc(env(safe-area-inset-top,0px) + 52px)}#toast{top:calc(env(safe-area-inset-top,0px) + 74px);font-size:20px}
.cb{bottom:calc(12px + env(safe-area-inset-bottom,0px));width:58px;height:58px}#bl{left:calc(14px + env(safe-area-inset-left,0px))}#br{left:calc(84px + env(safe-area-inset-left,0px))}
#gas{right:calc(14px + env(safe-area-inset-right,0px));width:68px;height:68px}#big{top:28%}#res ol{font-size:17px;margin:6px 0}#res li{padding:4px 10px;margin:3px 0}}
.tl img{object-fit:contain}.bp{display:block;width:100%;max-height:30vh;aspect-ratio:3/2;object-fit:contain;border-radius:6px;margin-bottom:4px;background:#1a2a3d}
*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#sl{position:fixed;inset:-12%;pointer-events:none;opacity:0;z-index:0;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,0) 0 3deg,rgba(235,245,255,.5) 3.4deg 3.8deg,rgba(255,255,255,0) 4.2deg 7deg);-webkit-mask-image:radial-gradient(ellipse at center,transparent 38%,#000 82%);mask-image:radial-gradient(ellipse at center,transparent 38%,#000 82%);animation:rush .16s steps(1) infinite;will-change:opacity,transform}

}

#sgrid{position:relative;display:block!important;overflow:hidden!important;min-height:0;padding:0!important;touch-action:pan-y;user-select:none}

<script>

function loft(secs, mat, N = 32, e = 0.62) {
  const rings = secs.map(s => {
    const r = [];
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      const c = Math.cos(a), n = Math.sin(a);
      const y = (s.yb + s.yt) / 2 + Math.sign(n) * Math.pow(Math.abs(n), e) * (s.yt - s.yb) / 2;
      const z = (s.z || 0) + Math.sign(c) * Math.pow(Math.abs(c), e) * s.w;
      r.push([s.x, y, z]);
    }
    return r;
  });
  const p = [];
  for (let i = 0; i < rings.length - 1; i++) {
    for (let j = 0; j < N; j++) {
      const a = rings[i][j], b = rings[i][(j + 1) % N];
      const c = rings[i + 1][(j + 1) % N], d = rings[i + 1][j];
      p.push(...a, ...b, ...c, ...a, ...c, ...d);
    }
  }
  [0, rings.length - 1].forEach(k => {
    const r = rings[k];
    const m = r.reduce((u, v) => [u[0] + v[0] / N, u[1] + v[1] / N, u[2] + v[2] / N], [0, 0, 0]);
    for (let j = 0; j < N; j++) p.push(...m, ...r[j], ...r[(j + 1) % N]);
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat);
  car.add(m);
  return m;
}

function box(x, y, z, w, h, d, mat, parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  (parent || car).add(m);
  return m;
}

function cyl(x, y, z, r, l, mat, seg = 16) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, l, seg), mat);
  m.rotation.z = Math.PI / 2;
  m.position.set(x, y, z);
  car.add(m);
  return m;
}

const wheels = [];
function buildWheel(r, wd, x, z, s) {
  const g = new THREE.Group();

  const tire = new THREE.Mesh(new THREE.CylinderGeometry(r, r, wd * 0.88, 36), tireMat);
  tire.rotation.x = Math.PI / 2;
  g.add(tire);

  [-1, 1].forEach(q => {
    const shoulder = new THREE.Mesh(new THREE.TorusGeometry(r * 0.91, r * 0.09, 10, 36), tireMat);
    shoulder.position.z = q * (wd * 0.41);
    g.add(shoulder);
  });

  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.78, r * 0.78, wd * 0.92, 32, 1, true), whiteRim);
  barrel.rotation.x = Math.PI / 2;
  g.add(barrel);

  const rotor = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.64, r * 0.64, 0.035, 28), chrome);
  rotor.rotation.x = Math.PI / 2;
  g.add(rotor);
  const rotorHat = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.36, r * 0.36, 0.055, 20), darkGray);
  rotorHat.rotation.x = Math.PI / 2;
  g.add(rotorHat);

  [-1, 1].forEach(q => {
    const zz = q * (wd * 0.46);
    const lip = new THREE.Mesh(new THREE.TorusGeometry(r * 0.78, 0.025, 10, 32), whiteRim);
    lip.position.z = zz;
    g.add(lip);

    for (let i = 0; i < 10; i++) {
      const a = (i * Math.PI * 2) / 10;
      const spoke = box(Math.cos(a) * r * 0.42, Math.sin(a) * r * 0.42, zz, r * 0.66, 0.038, 0.032, whiteRim, g);
      spoke.rotation.z = a;
    }

    const hub = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.16, r * 0.16, 0.04, 16), chrome);
    hub.rotation.x = Math.PI / 2;
    hub.position.z = zz + q * 0.015;
    g.add(hub);
  });

  g.position.set(x, r, z * s);
  car.add(g);
  wheels.push(g);

  box(x + 0.16, r + 0.05, s * (z - 0.03), 0.11, 0.18, 0.07, redTail);
}
